<style>
  :root {
    --cream:        #F5EBDC;
    --cream-deep:   #EFE0CB;
    --butter:       #F8D9A6;
    --berry:        #7B1E3A;
    --berry-deep:   #5C1129;
    --cocoa:        #2A1810;
    --ink:          #1A0F08;
    --rose:         #E8B4A0;
    --pistachio:    #A8B97F;
    --gold:         #C89B3C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Manrope', -apple-system, sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.6;
    overflow-x: hidden;
    /* Subtle paper-grain noise */
    background-image:
      radial-gradient(rgba(122,30,58,0.04) 1px, transparent 1px),
      radial-gradient(rgba(42,24,16,0.03) 1px, transparent 1px);
    background-size: 32px 32px, 17px 17px;
    background-position: 0 0, 8px 8px;
  }

  .display {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-variation-settings: "opsz" 144;
    letter-spacing: -0.02em;
    line-height: 1.02;
  }

  /* ---------- NAV ---------- */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 1.25rem 2.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(245, 235, 220, 0.7);
    border-bottom: 1px solid rgba(42,24,16,0.08);
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 1.5rem;
    color: var(--berry);
    letter-spacing: -0.02em;
  }
  .logo span { font-style: normal; color: var(--ink); font-weight: 400; }
  /* When logo is an image */
  .logo img.site-logo { height: 46px; width: auto; display: block; }
  .nav-links {
    display: flex;
    gap: 2.25rem;
    list-style: none;
  }
  .nav-links a {
    color: var(--ink);
    text-decoration: none;
    font-size: 0.875rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 500;
    position: relative;
    transition: color 0.3s;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0;
    width: 0; height: 1px;
    background: var(--berry);
    transition: width 0.3s ease;
  }
  .nav-links a:hover { color: var(--berry); }
  .nav-links a:hover::after { width: 100%; }
  .nav-mobile { display: none; }
